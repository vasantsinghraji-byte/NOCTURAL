services:
  redis-test:
    image: redis:7-alpine
    container_name: nocturnal-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongodb-replica-test:
    image: mongo:7.0
    container_name: nocturnal-mongodb-replica-test
    command: ["mongod", "--replSet", "nocturnal-test-rs", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    volumes:
      - mongodb_replica_test_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mongodb_replica_test_data:
