name: Render Smoke

on:
  workflow_run:
    workflows:
      - CI - Continuous Integration
    types:
      - completed
  # Monitoring fallback: run periodically against prod even if the deploy
  # webhook isn't wired, so a broken production surfaces within a few hours.
  schedule:
    - cron: '0 */6 * * *'
  # Reliable post-deploy trigger: Render runs auto-deploy outside GitHub Actions,
  # so configure a Render "Deploy succeeded" notification/webhook to POST a
  # repository_dispatch with event_type "render-deploy-succeeded" (see
  # docs/ops/render-post-deploy-smoke.md). That fires this smoke against the
  # freshly deployed instance instead of racing the deploy.
  repository_dispatch:
    types: [ render-deploy-succeeded ]
  workflow_dispatch:
    inputs:
      deployed_base_url:
        description: Deployed base URL to smoke test
        required: false
        type: string
        default: https://nocturnal-api.onrender.com
      expected_deployment_commit:
        description: Expected /api/v1/health deploymentCommit prefix
        required: false
        type: string
      origin:
        description: Comma-separated browser Origin headers to verify
        required: false
        type: string
        default: https://nocturnal-frontend-208z.onrender.com,https://nocturnal-api.onrender.com

permissions:
  contents: read

jobs:
  auth-cors-smoke:
    name: Post-Deploy Render Smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Wait for Render auto-deploy
        if: github.event_name == 'workflow_run'
        env:
          RENDER_SMOKE_WAIT_SECONDS: ${{ vars.RENDER_SMOKE_WAIT_SECONDS || '240' }}
        shell: bash
        run: sleep "$RENDER_SMOKE_WAIT_SECONDS"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: node ./node_modules/playwright/cli.js install --with-deps chromium

      - name: Smoke test deployed commit identity
        env:
          DEPLOYED_BASE_URL: ${{ github.event.inputs.deployed_base_url || vars.RENDER_SMOKE_BASE_URL || 'https://nocturnal-api.onrender.com' }}
          EXPECTED_DEPLOYMENT_COMMIT: ${{ github.event.inputs.expected_deployment_commit || github.event.workflow_run.head_sha || github.event.client_payload.deploymentCommit || github.event.client_payload.head_sha || github.event.client_payload.sha || '' }}
        run: npm run smoke:deployed-health-commit

      - name: Smoke test deployed login/register CORS
        env:
          DEPLOYED_BASE_URL: ${{ github.event.inputs.deployed_base_url || vars.RENDER_SMOKE_BASE_URL || 'https://nocturnal-api.onrender.com' }}
          SMOKE_ORIGINS: ${{ github.event.inputs.origin || vars.RENDER_SMOKE_ORIGINS || 'https://nocturnal-frontend-208z.onrender.com,https://nocturnal-api.onrender.com' }}
        run: npm run smoke:deployed-auth-cors

      - name: Smoke test deployed service worker cache headers
        env:
          DEPLOYED_BASE_URL: ${{ github.event.inputs.deployed_base_url || vars.RENDER_SMOKE_BASE_URL || 'https://nocturnal-api.onrender.com' }}
        run: npm run smoke:deployed-service-worker

      - name: Smoke test deployed CSP
        env:
          DEPLOYED_BASE_URL: ${{ github.event.inputs.deployed_base_url || vars.RENDER_SMOKE_BASE_URL || 'https://nocturnal-api.onrender.com' }}
        run: npm run smoke:deployed-csp

      # The legacy NOCTURAL service auto-deploys main too and shares the
      # production DB — fail if it drifts behind the canonical service (see
      # docs/ops/render-post-deploy-smoke.md). Scheduled/manual runs only:
      # post-deploy triggers could race the legacy service's own deploy.
      - name: Check legacy service commit parity
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          CANONICAL_BASE_URL: ${{ github.event.inputs.deployed_base_url || vars.RENDER_SMOKE_BASE_URL || 'https://nocturnal-api.onrender.com' }}
          LEGACY_BASE_URL: ${{ vars.RENDER_SMOKE_LEGACY_BASE_URL || 'https://noctural.onrender.com' }}
        shell: bash
        run: |
          fetch_commit() {
            # generous retries: free-tier services cold-start on first hit
            curl -sf --retry 8 --retry-delay 15 --retry-all-errors "$1/api/v1/health" \
              | jq -r '.deploymentCommit // empty'
          }
          canonical="$(fetch_commit "$CANONICAL_BASE_URL")"
          legacy="$(fetch_commit "$LEGACY_BASE_URL")"
          echo "canonical=$canonical"
          echo "legacy=$legacy"
          if [ -z "$canonical" ]; then
            echo "Could not read canonical deploymentCommit from $CANONICAL_BASE_URL" >&2
            exit 1
          fi
          if [ "$legacy" != "$canonical" ]; then
            echo "Legacy service ($LEGACY_BASE_URL) is not running the canonical commit — it has drifted behind main" >&2
            exit 1
          fi

      # Make the (otherwise silent) scheduled/post-deploy smoke actionable: alert
      # Slack only on failure. No-ops cleanly until SLACK_WEBHOOK_URL is configured.
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping failure alert"
            exit 0
          fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: Post-deploy Render smoke FAILED (${{ github.event_name }}) — ${run_url}\"}" \
            "$SLACK_WEBHOOK_URL"
