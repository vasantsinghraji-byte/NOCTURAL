name: Security Governance Protection Rollback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback-security-governance-protection:
    name: Roll Back Security Governance Branch Protection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Preflight branch-protection admin token
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_ADMIN_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/manage-security-governance-protection.js --mode=preflight --branches=main,develop

      - name: Restore bootstrap-safe branch protection
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_ADMIN_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/manage-security-governance-protection.js --mode=rollback --branches=main,develop

      - name: Report branch-protection status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_ADMIN_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/manage-security-governance-protection.js --mode=status --branches=main,develop
