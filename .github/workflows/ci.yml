name: CI - Continuous Integration

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches:
      - main
      - develop
      - "chore/**"
      - "feature/**"
      - "fix/**"
      - "refactor/**"
      - "docs/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.x'
  MONGODB_VERSION: '6.0'

jobs:
  # Code Quality Checks
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run repository governance check
        run: node scripts/run-stacked-pr-validation.js lint

      - name: Validate patient-health split invariants
        run: npm run validate:patient-health-split

  # Unit & Integration Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create test environment file
        env:
          CI_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          CI_ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
          CI_RAZORPAY_KEY_ID: ${{ secrets.CI_RAZORPAY_KEY_ID }}
          CI_RAZORPAY_KEY_SECRET: ${{ secrets.CI_RAZORPAY_KEY_SECRET }}
        run: |
          cat > .env.test <<EOF
          NODE_ENV=test
          PORT=5001
          MONGODB_URI=mongodb://localhost:27018/nocturnal_test?replicaSet=nocturnal-test-rs
          JWT_SECRET=${CI_JWT_SECRET:-ci-test-jwt-secret-placeholder}
          JWT_EXPIRE=7d
          ENCRYPTION_KEY=${CI_ENCRYPTION_KEY:-}
          ALLOWED_ORIGINS=http://localhost:3000
          RAZORPAY_KEY_ID=${CI_RAZORPAY_KEY_ID:-}
          RAZORPAY_KEY_SECRET=${CI_RAZORPAY_KEY_SECRET:-}
          EOF

      # A one-node replica set (docker-compose.replica-test.yml): transactions and
      # change streams need one; a standalone mongod can't run those code paths.
      - name: Start MongoDB replica set
        run: |
          docker compose -f docker-compose.replica-test.yml up -d mongodb-replica-test
          node scripts/init-test-replica-set.js

      - name: Run fast CI test suite
        run: node scripts/run-stacked-pr-validation.js test
        env:
          NODE_ENV: test
          PORT: 5001
          MONGODB_URI: mongodb://localhost:27018/nocturnal_test?replicaSet=nocturnal-test-rs
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-test-jwt-secret-placeholder' }}
          JWT_EXPIRE: 7d
          # Unset: tests/setup.js derives a valid 64-hex test key. If set, the secret must be 64 hex characters.
          ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.CI_RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.CI_RAZORPAY_KEY_SECRET }}

      - name: Upload test coverage artifact
        if: success() && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # Website (Next.js), app (Expo) and the shared API client in frontends/
  frontends:
    name: Website & App Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontends/web/package-lock.json
            frontends/mobile/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix frontends/web

      - name: Install app dependencies
        run: npm ci --prefix frontends/mobile

      # frontends/shared has no install of its own; web and app compile it through path mappings.
      - name: Type-check shared client
        run: frontends/web/node_modules/.bin/tsc --noEmit -p frontends/shared

      - name: Type-check website
        run: npm --prefix frontends/web run typecheck

      - name: Type-check app
        run: npm --prefix frontends/mobile run typecheck

      - name: App unit tests
        run: npm --prefix frontends/mobile test

      - name: Build website
        run: npm --prefix frontends/web run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # Secret Scanning
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for scanning all commits

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git --no-banner --redact --report-format sarif --report-path /repo/gitleaks-results.sarif --exit-code 1

      - name: Upload Gitleaks SARIF artifact
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif
          retention-days: 7
          if-no-files-found: ignore

  # Security Audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit root dependencies
        run: node scripts/run-stacked-pr-validation.js security

  codeowners-security-governance-gate:
    name: CODEOWNERS Security Governance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate stacked PR frontend ownership
        if: github.event_name == 'pull_request'
        run: node scripts/check-pr-stack-scope.js
        env:
          STACK_SCOPE_BRANCH: ${{ github.head_ref }}
          STACK_SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          STACK_SCOPE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate CODEOWNERS security-governance coverage
        run: npm run validate:codeowners-security -- --validate-owners
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run CODEOWNERS validator unit tests
        run: node ./node_modules/jest/bin/jest.js --config jest.fast.config.js --runInBand --runTestsByPath tests/unit/security/codeowners-security-coverage.test.js

  # Build + Deployment Gate Validation
  build:
    name: Deployment Gate
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft != true &&
      !contains(fromJSON('["chore/stack-ready-ci-gates","feature/security-audit-notification-core","fix/auth-session-revocation","feature/auth-webauthn-recovery","feature/admin-security-audit-export","fix/uploads-stored-file-authorization","fix/bookings-idempotent-payments","fix/patient-data-hardening","fix/provider-ops-hardening"]'), github.head_ref))
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: node ./node_modules/playwright/cli.js install --with-deps chromium

      - name: Run deployment gate validation
        run: npm run test:deploy-gate
        env:
          PLAYWRIGHT_STRICT_LAUNCH: 'true'

  public-funnel-e2e:
    name: Public Funnel E2E
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft != true &&
      !contains(fromJSON('["chore/stack-ready-ci-gates","feature/security-audit-notification-core","fix/auth-session-revocation","feature/auth-webauthn-recovery","feature/admin-security-audit-export","fix/uploads-stored-file-authorization","fix/bookings-idempotent-payments","fix/patient-data-hardening","fix/provider-ops-hardening"]'), github.head_ref))
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: node ./node_modules/playwright/cli.js install --with-deps chromium

      - name: Run public funnel browser test
        run: npm run test:e2e:public-funnel

      - name: Run browser CSP console test
        run: npm run test:e2e:csp

  # Validate container build without publishing
  container-smoke:
    name: Container Smoke Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft != true &&
      !contains(fromJSON('["chore/stack-ready-ci-gates","feature/security-audit-notification-core","fix/auth-session-revocation","feature/auth-webauthn-recovery","feature/admin-security-audit-export","fix/uploads-stored-file-authorization","fix/bookings-idempotent-payments","fix/patient-data-hardening","fix/provider-ops-hardening"]'), github.head_ref))
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: nocturnal-ci:${{ github.sha }}
          cache-from: type=gha
          # ignore-error: a GHA cache-export hiccup (504 / not_found) must not fail
          # the build - the image is already built by this point.
          cache-to: type=gha,mode=max,ignore-error=true

  # API Documentation
  docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Generate API docs
        run: |
          echo "API documentation generation placeholder"
          # Add Swagger/OpenAPI doc generation here
        continue-on-error: true

  # Notification
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [lint, test, frontends, secret-scan, security, codeowners-security-governance-gate, build, public-funnel-e2e, container-smoke]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check status
        run: |
          echo "CI Pipeline completed"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Website & App: ${{ needs.frontends.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Secret Scan: ${{ needs.secret-scan.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "CODEOWNERS Security Governance Gate: ${{ needs.codeowners-security-governance-gate.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Public Funnel E2E: ${{ needs.public-funnel-e2e.result }}"
          echo "Container Smoke: ${{ needs.container-smoke.result }}"
