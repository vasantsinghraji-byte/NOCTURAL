# Dependabot configuration — keeps dependencies patched and surfaces vulnerable
# packages via update PRs. (Dependabot *alerts* are additionally toggled under
# Settings → Code security and analysis.)
version: 2
updates:
  # Backend (root) npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    # Target develop so dependency PRs ride the normal develop -> main promotion
    # instead of landing on main directly (which caused main/develop divergence).
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      backend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # Bundle backend major bumps into a single PR too (still separate from
      # minor/patch so the riskier majors can be reviewed together).
      backend-major:
        update-types:
          - "major"

  # Frontend client npm dependencies
  - package-ecosystem: "npm"
    directory: "/client"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # Bundle frontend major bumps into a single PR too (separate from
      # minor/patch for easier review of the riskier majors).
      frontend-major:
        update-types:
          - "major"

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "ci"
    groups:
      # Bundle all Action minor/patch bumps into a single weekly PR instead of
      # one PR per action.
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Action major bumps can change runner behavior/defaults — review those
      # out-of-band rather than auto-opening PRs for them.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
