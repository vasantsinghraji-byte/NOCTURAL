# Dependabot configuration — keeps dependencies patched and surfaces vulnerable
# packages via update PRs. (Dependabot *alerts* are additionally toggled under
# Settings → Code security and analysis.)
version: 2
updates:
  # Backend (root) npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      backend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Frontend client npm dependencies
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "ci"
    groups:
      # Bundle all Action minor/patch bumps into a single weekly PR instead of
      # one PR per action.
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Action major bumps can change runner behavior/defaults — review those
      # out-of-band rather than auto-opening PRs for them.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
