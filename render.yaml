# Render Blueprint - Infrastructure as Code
# Deploy with: Connect repo to Render, it will auto-detect this file
# Custom Domain: Add in Render Dashboard > Settings > Custom Domains

services:
  # Backend API Service
  - type: web
    name: nocturnal-api
    runtime: node
    region: singapore  # Change to your preferred region
    plan: free  # Use 'starter' for production
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 5000
      # MongoDB Atlas with Authentication
      - key: MONGODB_URI
        sync: false  # Set manually in Render dashboard
      - key: MONGODB_AUTH_SOURCE
        value: admin
      - key: MONGODB_AUTH_MECHANISM
        value: SCRAM-SHA-256
      - key: MONGODB_READ_PREFERENCE
        value: primaryPreferred
      - key: MONGODB_WRITE_CONCERN_W
        value: majority
      - key: MONGODB_READ_CONCERN
        value: majority
      # Security
      - key: JWT_SECRET
        sync: false  # Set manually in Render dashboard
      # Token lifetimes consumed by middleware/auth.js (the live signing path).
      # JWT_EXPIRE was removed: it only fed config/environments.js, which is not
      # imported by the runtime auth path, so it had no effect on issued tokens.
      - key: JWT_ACCESS_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: ENCRYPTION_KEY
        sync: false  # Set manually in Render dashboard
      - key: APP_URL
        value: https://nocturnal-api.onrender.com
      # Set this to the final custom frontend domain when chosen.
      # middleware/security.js automatically adds it to the production CORS allowlist.
      - key: FRONTEND_URL
        value: https://nocturnal.com
      - key: ALLOWED_ORIGINS
        value: https://noctural.onrender.com,https://nocturnal-api.onrender.com,https://nocturnal-frontend.onrender.com,https://nocturnal-frontend-208z.onrender.com,https://nocturnal.com
      # Optional Services
      - key: REDIS_ENABLED
        value: false
      # Optional email webhook used by hospital waitlist notifications.
      # Set EMAIL_WEBHOOK_URL and EMAIL_WEBHOOK_TOKEN manually in Render.
      - key: EMAIL_WEBHOOK_URL
        sync: false
      - key: EMAIL_WEBHOOK_TOKEN
        sync: false
      - key: EMAIL_FROM
        value: Nocturnal <no-reply@nocturnal.com>
      - key: SECURITY_NOTIFICATION_OUTBOX_ENABLED
        value: true
      - key: WEBAUTHN_RP_NAME
        value: Nocturnal
      - key: WEBAUTHN_RP_ID
        value: nocturnal.com
      - key: WEBAUTHN_ORIGIN
        value: https://nocturnal.com
      - key: COMPROMISED_PASSWORD_CHECK_ENABLED
        value: true
      - key: COMPROMISED_PASSWORD_CHECK_FAIL_OPEN
        value: false
      # Only populate this with known immediate reverse-proxy IPs. Location
      # headers are ignored when the request does not originate from this list.
      - key: TRUSTED_LOCATION_PROXY_IPS
        sync: false
      - key: WAITLIST_ADMIN_EMAIL
        sync: false
      - key: LOG_LEVEL
        value: warn
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: nocturnal-frontend
    runtime: static
    buildCommand: npm --prefix client ci && npm --prefix client run build
    staticPublishPath: client/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /css/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      # Frontend code should use same-origin /api/* requests via AppConfig.api().
      # This rewrite is the deployment source of truth for custom domains and previews.
      - type: rewrite
        source: /api/*
        destination: https://nocturnal-api.onrender.com/api/*
    envVars:
      - key: NODE_VERSION
        value: 22
